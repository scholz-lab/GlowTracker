[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = [
    "."
]
exclude = [
    "glowtracker.TestFunctions*",
    "tests*"
]

[tool.setuptools.package-data]
glowtracker = [
    "layout.kv",
    "icons/*",
    "settings/default.pfs",
    "settings/gui_settings.json",
    "settings/experiment_settings.json"
]

[project]
name = "glowtracker"
version = "1.0.1"
description = "GlowTracker provides a graphical user interface to operate a microscope. The microscope is a hardware setup designed for tracking a small animal in bright field, single or dual epi-fluorescence imaging."
authors = [
    { name="Monika Scholz", email="monika.scholz@mpinb.mpg.de" }
]
maintainers = [
    { name="Monika Scholz", email="monika.scholz@mpinb.mpg.de" },
    { name="Takkasila Saichol", email="takkasila.saichol@mpinb.mpg.de" }
]
readme = "README.md"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "itk-elastix==0.21.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "itk-elastix==0.23.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "kivy>=2.3.1,<3",
    "labjackpython>=2.1,<3",
    "matplotlib>=3.9,<4",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.10,<5",
    "overrides>=7.7,<8",
    "pandas>=2.2,<4",
    "pillow>=11,<13",
    "platformdirs>=4,<5",
    "pyparsing>=3.2,<4",
    "pypylon>=26.5,<27",
    "scikit-image>=0.25,<0.27",
    "scipy>=1.15,<2",
    "tifffile>=2025.5",
    "zaber-motion>=9,<10"
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = [
    "python",
    "research",
    "microscope",
    "tracking",
    "Zaber",
    "Basler"
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10"
]

[project.scripts]
glowtracker = "glowtracker:initApp"

[project.urls]
Homepage = "https://github.com/scholz-lab/GlowTracker"
Issues = "https://github.com/scholz-lab/GlowTracker/issues"
Documentation = "https://scholz-lab.github.io/GlowTracker/"
Repository = "https://github.com/scholz-lab/GlowTracker.git"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
